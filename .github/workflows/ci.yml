name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: school_user
          POSTGRES_PASSWORD: school_password
          POSTGRES_DB: school_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://school_user:school_password@localhost:5432/school_db
          DATABASE_URL_DIRECT: postgresql+asyncpg://school_user:school_password@localhost:5432/school_db
          SECRET_KEY: test-secret-key-minimum-32-characters-ci-environment
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 60
          ENVIRONMENT: test
        run: |
          cd backend
          alembic upgrade head
          pytest tests/ -v --tb=short

